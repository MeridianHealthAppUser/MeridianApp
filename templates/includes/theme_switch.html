{# Device, Light or Dark for people who aren't signed in: the sign-in and questionnaire pages (signed in, it's in the account menu). static/js/theme.js shows it, keeps the buttons in step and saves the choice in this browser. #}
<div class="theme-switch" role="group" aria-label="Appearance" data-theme-switch hidden>
  <span class="theme-switch__label" aria-hidden="true">Appearance</span>
  <div class="theme-switch__choices">
    <button type="button" data-theme-choice="system" aria-pressed="true" title="Match this device"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Device</span></button>
    <button type="button" data-theme-choice="light" aria-pressed="false" title="Light mode"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span></button>
    <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark mode"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><span>Dark</span></button>
  </div>
</div>
