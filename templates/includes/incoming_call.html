<aside class="incoming-call" id="incoming-call" hidden aria-label="Incoming video consultation">
  <div class="incoming-call__icon" aria-hidden="true">↗</div>
  <div class="incoming-call__copy" role="status" aria-live="polite">
    <strong id="incoming-call-title">Incoming consultation</strong>
    <span id="incoming-call-practice"></span>
    <small>Your camera stays off until you choose to join.</small>
  </div>
  <div class="incoming-call__actions">
    <a id="incoming-call-join" class="incoming-call__join" href="#">Open room</a>
    <button id="incoming-call-dismiss" type="button">Dismiss</button>
  </div>
</aside>
