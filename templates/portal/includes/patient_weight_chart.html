{% load workspace_ui %}
<figure class="patient-weight-chart">
  <svg viewBox="0 0 720 250" role="img" aria-labelledby="{{ chart_id }}-title {{ chart_id }}-description">
    <title id="{{ chart_id }}-title">Recorded weight in kilograms{% if chart.reference.polygon %} with an illustrative reference{% endif %}</title><desc id="{{ chart_id }}-description">{{ chart.count }} check-in{{ chart.count|pluralize }} from {{ chart.start|date:"j M Y" }} to {{ chart.recorded_end|date:"j M Y" }}.{% if chart.reference.polygon %} The shaded band illustrates 500g to 1kg per week after a four-week starter period. It is not a prediction or a personal target. The solid line and dots show only your recorded measurements.{% elif chart.reference %} The illustrative reference falls outside the dates shown. The line and dots show your recorded measurements.{% else %} Each recorded point is labelled with its date and weight.{% endif %}</desc>
    {% for tick in chart.ticks %}<line x1="62" x2="692" y1="{{ tick.y }}" y2="{{ tick.y }}" class="patient-weight-chart__grid"/><text x="10" y="{{ tick.y|add:'4' }}">{{ tick.label }}</text>{% endfor %}
    {% if chart.reference.polygon %}
      <polygon points="{{ chart.reference.polygon }}" class="patient-weight-chart__reference"/>
      <polyline points="{{ chart.reference.upper_line }}" class="patient-weight-chart__reference-edge"/>
      <polyline points="{{ chart.reference.lower_line }}" class="patient-weight-chart__reference-edge"/>
    {% endif %}
    {% if chart.reference.starter_x %}<line x1="{{ chart.reference.starter_x }}" x2="{{ chart.reference.starter_x }}" y1="32" y2="212" class="patient-weight-chart__starter"/>{% endif %}
    <polyline points="{{ chart.polyline }}" class="patient-weight-chart__line"/>
    {% for point in chart.points %}<circle cx="{{ point.x }}" cy="{{ point.y }}" r="3" class="patient-weight-chart__point"><title>{{ point.date|date:"j M Y" }}: {{ point.weight|kg }} kg</title></circle>{% endfor %}
    <text x="62" y="240">{{ chart.start|date:"j M Y" }}</text><text x="692" y="240" text-anchor="end">{{ chart.end|date:"j M Y" }}</text>
  </svg>
  <div class="patient-weight-chart__range"><span>{{ chart.start|date:"j M Y" }} – {{ chart.end|date:"j M Y" }}</span><span>Recorded {{ chart.minimum|kg }}–{{ chart.maximum|kg }} kg</span></div>
  {% if chart.reference %}
    <figcaption>
      <div class="patient-weight-chart__legend"><span><i class="patient-weight-chart__key patient-weight-chart__key--recorded" aria-hidden="true"></i>Your recorded weight</span>{% if chart.reference.polygon %}<span><i class="patient-weight-chart__key patient-weight-chart__key--reference" aria-hidden="true"></i>Illustrative reference · 500g–1kg/week</span>{% endif %}</div>
      {% if not chart.reference.polygon %}<p>The illustrative 500g–1kg/week reference falls outside the dates shown.</p>{% endif %}
      <p>The reference starts after four starter weeks from your prescribed treatment start on {{ chart.reference.treatment_start|date:"j M Y" }}, and ends on {{ chart.reference.ends_on|date:"j M Y" }} (within the prescription dates, up to {{ chart.reference.weeks_limit }} weeks after the starter period). It uses {{ chart.reference.baseline_weight|kg }} kg recorded on {{ chart.reference.baseline_date|date:"j M Y" }}{% if chart.reference.baseline_date > chart.reference.treatment_start %}, beginning no earlier than that check-in{% endif %}. It is not a prediction or a personal target; your response may differ.</p>
      {% if caption %}<p>{{ caption }}</p>{% endif %}
    </figcaption>
  {% elif caption %}<figcaption>{{ caption }}</figcaption>{% endif %}
</figure>
