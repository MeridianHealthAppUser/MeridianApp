{% if page_obj.has_other_pages %}
  <nav class="patient-pagination" aria-label="{{ pagination_label|default:'Results' }} pages">
    {% if page_obj.has_previous %}<a class="console-button console-button--secondary" href="?{{ pagination_query }}{% if pagination_query %}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="console-button console-button--secondary" href="?{{ pagination_query }}{% if pagination_query %}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>{% endif %}
  </nav>
{% endif %}
