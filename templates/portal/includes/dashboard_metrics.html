{% load workspace_ui %}
<section class="{{ metrics_class|default:'console-metrics' }}" aria-label="Practice metrics">
  {% for metric_name, metric_value in metrics.items %}
  <article class="metric-card">
    <span class="metric-card__label">{{ metric_name|metric_label }}</span>
    <strong class="metric-card__value">{{ metric_value }}</strong>
  </article>
  {% empty %}
  <article class="metric-card"><span class="metric-card__label">Practice activity</span><strong class="metric-card__value">—</strong><span class="metric-card__hint">Metrics will appear as care is recorded.</span></article>
  {% endfor %}
</section>
