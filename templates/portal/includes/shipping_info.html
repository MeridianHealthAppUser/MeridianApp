{% if shipment.waybill_context %}<form method="post" action="{% url 'portal:ops-shipment-waybill' shipment.pk %}" class="shipping-waybill-form">{% csrf_token %}<input type="hidden" name="workflow_context" value="{{ shipment.waybill_context }}"><input type="hidden" name="list_query" value="{{ list_query }}"><input type="text" name="waybill" maxlength="60" required placeholder="Enter waybill" aria-label="Waybill for {{ shipment.patient }}"><button type="submit" class="console-button console-button--secondary">Save</button></form>{% else %}<span class="shipping-waybill">{% if shipment.waybill %}{{ shipment.waybill }}{% elif shipment.tracking_number %}{{ shipment.tracking_number }}{% else %}—<span class="sr-only"> No waybill recorded</span>{% endif %}</span>
{% endif %}
