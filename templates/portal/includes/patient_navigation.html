{% load static %}
<nav class="patient-navigation" aria-label="Patient navigation">
  <p class="patient-navigation__heading">Your care</p>
  <div class="patient-navigation__links" data-scroll-navigation>
    <a href="{% url 'portal:patient-dashboard' %}"{% if patient_nav == 'home' %} class="is-active" aria-current="{% if patient_section == 'overview' %}page{% else %}true{% endif %}"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg><span class="patient-navigation__label">Home</span>
    </a>
    <a href="{% url 'portal:patient-treatment' %}"{% if patient_nav == 'treatment' %} class="is-active" aria-current="{% if patient_section == 'treatment' %}page{% else %}true{% endif %}"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21S3 15 3 9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-9 12-9 12Z"/><path d="M8 11h8m-4-4v8"/></svg><span class="patient-navigation__label"><span class="patient-navigation__prefix">My </span>Treatment</span>
    </a>
    <a href="{% url 'portal:patient-appointments' %}"{% if patient_nav == 'appointments' %} class="is-active" aria-current="{% if patient_section == 'appointments' and request.resolver_match.url_name == 'patient-appointments' %}page{% else %}true{% endif %}"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2m-8 3h2"/></svg><span class="patient-navigation__label"><span class="patient-navigation__prefix">My </span>Appointments</span>
    </a>
    <a href="{% url 'portal:patient-messages' %}"{% if patient_nav == 'messages' %} class="is-active" aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 15a3 3 0 0 1-3 3H9l-6 3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3Z"/><path d="M7 8h10M7 12h7"/></svg><span class="patient-navigation__label"><span class="patient-navigation__prefix">My </span>Messages</span>{% if patient_unread_messages %}<span class="patient-navigation__badge" aria-hidden="true">{% if patient_unread_messages > 9 %}9+{% else %}{{ patient_unread_messages }}{% endif %}</span><span class="sr-only">, {{ patient_unread_messages }} unread</span>{% endif %}
    </a>
    <a href="{% url 'portal:patient-pharmacy' %}"{% if patient_nav == 'medications' %} class="is-active" aria-current="{% if patient_section == 'pharmacy' %}page{% else %}true{% endif %}"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16v14H4ZM8 7V3h8v4M9 14h6m-3-3v6"/></svg><span class="patient-navigation__label"><span class="patient-navigation__prefix">My </span>Medications</span>
    </a>
  </div>
</nav>
<script src="{% static 'js/navigation.js' %}" defer></script>
