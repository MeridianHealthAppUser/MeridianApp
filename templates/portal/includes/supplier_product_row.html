<div class="supplier-product-row" data-supplier-product-row{% if line.DELETE.value %} hidden{% endif %}>
  <div class="ops-form-field">{{ line.product.label_tag }}{{ line.product }}{{ line.product.errors }}</div>
  <div class="ops-form-field">{{ line.supplier_code.label_tag }}{{ line.supplier_code }}{{ line.supplier_code.errors }}</div>
  <span hidden>{{ line.DELETE }}</span><button class="supplier-icon supplier-icon--delete" type="button" data-remove-supplier-product aria-label="Remove product" title="Remove product"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></button>
  {{ line.non_field_errors }}
</div>
