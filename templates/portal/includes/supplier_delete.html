<dialog id="supplier-delete" class="app-dialog supplier-delete-dialog" open aria-labelledby="supplier-delete-title"><div class="app-dialog__body"><h2 id="supplier-delete-title">Delete {{ delete_supplier.name }}?</h2><p class="app-dialog__sub">This removes the supplier and its product links. Your products and stock are kept. Existing purchase orders keep their saved supplier details.</p><form method="post" action="{% url 'portal:supplier-delete' delete_supplier.pk %}">{% csrf_token %}<input type="hidden" name="workflow_context" value="{{ supplier_delete_context }}"><input type="hidden" name="q" value="{{ search }}">{% if supplier_delete_error %}<p class="staff-filter-error" role="alert">{{ supplier_delete_error }}</p>{% endif %}<div class="app-dialog__actions"><a href="{{ supplier_return_url }}" class="console-button console-button--secondary" data-dialog-close>Cancel</a><button class="console-button supplier-delete-button" type="submit">Delete supplier</button></div></form></div></dialog>
