{% comment %}An appointment's details (care.emails.appointment_details) in a soft blue box.{% endcomment %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:460px;margin:0 0 20px;background:#f3f8fa;border:1px solid #d2e2e8;border-radius:12px;">
          <tr>
            <td style="padding:12px 18px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">{% for label, value in details %}
                <tr>
                  <td style="padding:5px 16px 5px 0;width:92px;vertical-align:top;font-size:14px;color:#506e7c;">{{ label }}</td>
                  <td style="padding:5px 0;vertical-align:top;font-weight:500;color:#1d4a5e;">{{ value }}</td>
                </tr>{% endfor %}
              </table>
            </td>
          </tr>
        </table>
