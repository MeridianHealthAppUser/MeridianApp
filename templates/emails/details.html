{% comment %}An appointment's details (care.emails.appointment_details) in a soft teal box.{% endcomment %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:460px;margin:0 0 20px;background:#eff8f6;border:1px solid #d5ebe6;border-radius:12px;">
          <tr>
            <td style="padding:12px 18px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">{% for label, value in details %}
                <tr>
                  <td style="padding:5px 16px 5px 0;width:92px;vertical-align:top;font-size:14px;color:#5a7274;">{{ label }}</td>
                  <td style="padding:5px 0;vertical-align:top;font-weight:500;color:#183638;">{{ value }}</td>
                </tr>{% endfor %}
              </table>
            </td>
          </tr>
        </table>
